<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#efebe6">
<title>Gustavo</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=50">
<link rel="stylesheet" href="app.css?v=50">
<script src="auth.js?v=50"></script>
<script>
  // No sign-in step: start a session straight away.
  ensureSession();
  // Turn dark mode on before the first paint, so there's no white flash.
  try { if (localStorage.getItem('gustavo_theme') === 'dark') document.documentElement.classList.add('dark'); } catch {}
</script>
</head>
<body class="app-body">
<div class="shell">
  <nav class="rail" aria-label="Main">
    <a class="rail-btn rail-me" data-route="home" data-action="my-dashboard" href="#/home" data-label="My dashboard" aria-label="My dashboard"><span data-me-avatar="badge"></span></a>
    <div class="rail-sep"></div>
    <button class="rail-btn rail-new" data-action="new-file" data-label="New file · opens in a new tab  (N)" aria-label="New file (opens in a new tab)"><span data-icon="plus"></span></button>
    <button class="rail-btn" data-action="search" data-label="Search a client or case  (/)" aria-label="Search a client or case"><span data-icon="search"></span></button>
    <a class="rail-btn" data-route="activity" href="#/activity" data-label="Activity · all open cases" aria-label="Activity: all open cases"><span data-icon="activity"></span></a>
    <a class="rail-btn" data-route="suppliers" href="#/suppliers" data-label="Suppliers" aria-label="Suppliers"><span data-icon="store"></span></a>
    <button class="rail-btn" data-action="advanced-search" data-label="Advanced search" aria-label="Advanced search"><span data-icon="sliders"></span></button>
    <a class="rail-btn" data-route="settings" href="#/settings" data-label="Settings" aria-label="Settings"><span data-icon="settings"></span></a>
    <div class="rail-bottom">
      <button class="rail-btn" data-action="toggle-dark" data-dark-toggle data-label="Dark mode" aria-label="Dark mode" aria-pressed="false"></button>
      <button class="rail-btn" data-action="sign-out" data-label="Log out" aria-label="Log out"><span data-icon="logout"></span></button>
    </div>
  </nav>

  <main id="view" class="content"></main>
</div>

<nav class="tabbar" aria-label="Main">
  <a class="tab" data-route="home" data-action="my-dashboard" href="#/home"><span data-me-avatar></span>Me</a>
  <button class="tab" data-action="search"><span data-icon="search"></span>Search</button>
  <button class="tab-plus" data-action="new-file" aria-label="New file (opens in a new tab)"><span data-icon="plus"></span></button>
  <a class="tab" data-route="activity" href="#/activity"><span data-icon="activity"></span>Activity</a>
  <a class="tab" data-route="suppliers" href="#/suppliers"><span data-icon="store"></span>Suppliers</a>
  <a class="tab" data-route="settings" href="#/settings"><span data-icon="settings"></span>Settings</a>
</nav>

<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="tooltip" class="tooltip hidden" role="tooltip"></div>

<script src="data.js?v=50"></script>
<script src="flags.js?v=50"></script>
<script src="app.js?v=50"></script>
</body>
</html>
