<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f2">
<title>Gustavo</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=49">
</head>
<body class="login-page">
<div class="login-shell">
  <!-- Welcome: no username or password, one click in. -->
  <main class="signin-panel">
    <div class="signin-inner">
      <div class="signin-eyebrow">
        <span>001</span>
        <span>Welcome</span>
      </div>

      <div class="signin-title">
        <h1>Gustavo</h1>
        <img class="app-icon" src="favicon.svg" alt="" width="64" height="64">
      </div>

      <p class="signin-lede">The concierge team’s CRM. <strong>Clients, requests, suppliers and follow-ups, all in one dashboard.</strong></p>

      <a class="btn btn-primary btn-block enter-btn" id="enterBtn" href="app.html">Enter Gustavo</a>
    </div>
  </main>

  <!-- Brand panel: the logo and what the dashboard is for. -->
  <section class="brand-panel">
    <div class="brand-grid" aria-hidden="true"></div>
    <svg class="brand-logo" viewBox="0 0 100 100" fill="none" stroke-linecap="round" aria-hidden="true">
      <path d="M74.6 32.8 A30 30 0 1 0 78.2 60.3" stroke="currentColor" stroke-width="17"/>
      <path d="M59 56 L78 56" stroke="currentColor" stroke-width="15" opacity="0.7"/>
    </svg>
    <p class="brand-tagline">Gustavo – Concierge Services</p>
  </section>
</div>

<script src="auth.js?v=49"></script>
<script src="login.js?v=49"></script>
</body>
</html>
