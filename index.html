<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Gustavo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
<main class="login-card">
  <div class="brand">
    <div class="brand-mark">G</div>
    <span class="brand-name">Gustavo</span>
  </div>

  <h1>Sign in</h1>
  <p class="login-sub">Enter your username and password to continue.</p>

  <div id="loginError" class="login-error hidden" role="alert"></div>

  <form id="loginForm" novalidate>
    <div class="form-field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus required>
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">Show</button>
      </div>
    </div>

    <div class="form-options">
      <label class="checkbox">
        <input id="remember" type="checkbox">
        Remember me
      </label>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </form>

  <p class="login-footer">Need access? Contact your account administrator.</p>
</main>

<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
